    html[data-doc-theme="light"] .markdown-section code {
      background: #e9edf7;
      color: #34415d;
    }

    html[data-doc-theme="light"] .markdown-section pre,
    html[data-doc-theme="light"] .astra-code-tabs,
    html[data-doc-theme="light"] .astra-code-panel pre {
      border-color: #c4ccda;
      background: #20232b !important;
      box-shadow: none;
    }

    html[data-doc-theme="light"] .markdown-section pre code {
      color: #e4eafb !important;
    }

    html[data-doc-theme="light"] .markdown-section pre::before {
      content: none;
    }

    html[data-doc-theme="light"] .markdown-section .docsify-copy-code-button {
      border-color: #454d5c;
      background-color: #20232b;
    }

    html[data-doc-theme="light"] .astra-code-tab {
      color: #68748a;
    }

    html[data-doc-theme="light"] .astra-code-single-label {
      color: #47516a;
    }

    html[data-doc-theme="light"] .astra-code-tab[aria-selected="true"] {
      color: #394b9c;
    }

    html[data-doc-theme="light"] .page-toc {
      border-left-color: #dbe2ef;
      color: #56627a;
    }

    html[data-doc-theme="light"] .page-toc-title {
      color: #27344e;
    }

    html[data-doc-theme="light"] .page-toc a {
      color: #56627a;
    }

    html[data-doc-theme="light"] .page-toc a[data-level="3"] {
      color: #74819a;
    }

    html[data-doc-theme="light"] .page-toc a:hover {
      color: #394b9c;
    }

    html[data-doc-theme="light"] .markdown-section blockquote {
      border-color: #dfe5f1;
      border-left-color: #7182f4;
      background: #eef1fa;
    }

    html[data-doc-theme="light"] .markdown-section th {
      background: #e9edf7;
      color: #29364f;
    }

    html[data-doc-theme="light"] .markdown-section td {
      border-color: #e1e6f0;
      background: #ffffff;
      color: #3e4a63;
    }

    html[data-doc-theme="light"] .markdown-section tr:nth-child(odd) td {
      background: #f7f8fc;
    }

    .page-toc {
      position: fixed;
      top: 100px;
      right: 28px;
      z-index: 5;
      width: 190px;
      max-height: calc(100vh - 124px);
      overflow-y: auto;
      padding: 0 0 16px 14px;
      border-left: 1px solid rgba(133, 151, 190, 0.16);
      color: #aab8cf;
    }

    .page-toc.is-visible {
      display: none;
    }

    .page-toc-title {
      margin: 0 0 11px;
      color: #f3f6fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .page-toc-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .page-toc a {
      display: block;
      padding: 5px 0;
      color: #b4c0d5;
      font-size: 11px;
      line-height: 1.45;
      text-decoration: none;
    }

    .page-toc a[data-level="3"] {
      padding-left: 10px;
      color: #9aa9c2;
    }

    .page-toc a:hover {
      color: #d0d8ff;
    }

    body.sidebar-collapsed .sidebar {
      transform: translateX(-100%);
    }

    body.sidebar-collapsed .content {
      left: 0;
      width: 100%;
    }

    body.sidebar-collapsed .docs-topbar {
      left: 0;
    }

    .sidebar-toggle {
      display: none !important;
    }

    @media (min-width: 1540px) {
      .content {
        width: calc(100% - var(--docs-content-left) - 240px);
      }

      .page-toc.is-visible {
        display: block;
      }

      body.sidebar-collapsed .content {
        width: calc(100% - 240px);
      }
    }

    @media (max-width: 768px) {
      :root {
        --docs-topbar-height: 58px;
      }

      html body .content,
      html body.sidebar-collapsed .content {
        left: 0 !important;
        width: 100% !important;
      }

      html body .docs-topbar,
      html body.sidebar-collapsed .docs-topbar {
        right: 0 !important;
        left: 0 !important;
        width: auto !important;
        gap: 10px;
        padding: 0 12px;
      }

      html body.ready.sticky .content {
        left: 0 !important;
        width: 100% !important;
      }

      html body.ready .docs-topbar {
        left: 0 !important;
        right: 0 !important;
        width: auto !important;
      }

      .sidebar {
        z-index: 1002;
        left: 0 !important;
        width: min(272px, 84vw);
        transform: translateX(-100%);
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      .markdown-section {
        padding: 25px 20px 64px;
      }

      .markdown-section h1 {
        font-size: 2rem;
      }

      .page-toc,
      .topbar-github,
      .theme-toggle span {
        display: none !important;
      }

      .topbar-breadcrumbs {
        gap: 5px;
        font-size: 11px;
      }

      .topbar-actions {
        gap: 6px;
      }

      .theme-toggle {
        width: 36px;
        padding: 0;
      }

      .language-switcher select {
        min-width: 88px;
        padding: 0 7px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading Astra UI docs...</div>
  <header class="docs-topbar">
    <button id="sidebar-toggle" class="sidebar-toggle-button" type="button" aria-label="Toggle navigation" aria-expanded="true" title="Toggle navigation">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <nav class="topbar-breadcrumbs" aria-label="Breadcrumb">
      <a id="breadcrumb-home" href="#/README">Docs</a>
      <span aria-hidden="true">/</span>
      <span id="breadcrumb-section">Guide</span>
      <span aria-hidden="true">/</span>
      <strong id="breadcrumb-page">Astra UI</strong>
    </nav>
    <div class="topbar-actions">
      <a class="topbar-github" href="https://github.com/arsyny1x/Astra-Ui-Library" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 19c-4.3 1.4-4.3-2.2-6-2.5M15 21v-3.1a2.7 2.7 0 0 0-.8-2.1c2.7-.3 5.5-1.3 5.5-6a4.7 4.7 0 0 0-1.2-3.2 4.3 4.3 0 0 0-.1-3.2s-1-.3-3.4 1.2a11.8 11.8 0 0 0-6.1 0C6.5 3.1 5.5 3.4 5.5 3.4a4.3 4.3 0 0 0-.1 3.2 4.7 4.7 0 0 0-1.2 3.3c0 4.7 2.8 5.7 5.5 6A2.7 2.7 0 0 0 9 18v3"></path>
        </svg>
        <span>GitHub</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
        </svg>
        <span>Light</span>
      </button>
      <div class="language-switcher">
        <select id="language-select" aria-label="Language / ภาษา" title="Language / ภาษา">
          <option value="en">English</option>
          <option value="th">ไทย</option>
        </select>
      </div>
    </div>
  </header>
  <aside id="page-toc" class="page-toc" aria-label="On this page"></aside>
  <script>
    window.$docsify = {
      name: "Astra UI",
      repo: "",
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      alias: {
        "/demo\\.lua$": "/docs/demo.md"
      },
      search: {
        depth: 4,
        placeholder: "Search the docs",
        noData: "No results found.",
        paths: "auto"
      },
      copyCode: {
        buttonText: "Copy",
        errorText: "Copy failed",
        successText: "Copied"
      },
      hooks: {
        doneEach: function() {
          if (window.Prism) {
            window.Prism.highlightAll();
          }
          if (window.updateDocsLanguage) {
            window.setTimeout(window.updateDocsLanguage, 100);
          }
        }
      },
      pagination: {
        previousText: "Previous",
        nextText: "Next",
        crossChapter: true
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-lua.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script>
    (function() {
      var languageSelect = document.getElementById("language-select");
      var themeToggle = document.getElementById("theme-toggle");
      var sidebarToggle = document.getElementById("sidebar-toggle");
      var pageToc = document.getElementById("page-toc");

      function updateLanguageUi(isThai) {
        var searchPlaceholder = isThai ? "ค้นหาเอกสาร" : "Search the docs";
        var noSearchResults = isThai ? "ไม่พบผลลัพธ์" : "No results found.";
        var copyLabels = isThai
          ? { button: "คัดลอก", error: "คัดลอกไม่สำเร็จ", success: "คัดลอกแล้ว" }
          : { button: "Copy", error: "Copy failed", success: "Copied" };
        var config = window.$docsify;

        document.documentElement.lang = isThai ? "th" : "en";
        var languageLabel = isThai ? "เลือกภาษา" : "Choose language";
        if (languageSelect.getAttribute("aria-label") !== languageLabel) {
          languageSelect.setAttribute("aria-label", languageLabel);
        }
        if (languageSelect.title !== languageLabel) {
          languageSelect.title = languageLabel;
        }

        config.search.placeholder = searchPlaceholder;
        config.search.noData = noSearchResults;
        config.copyCode.buttonText = copyLabels.button;
        config.copyCode.errorText = copyLabels.error;
        config.copyCode.successText = copyLabels.success;
        config.pagination.previousText = isThai ? "ก่อนหน้า" : "Previous";
        config.pagination.nextText = isThai ? "ถัดไป" : "Next";

        var searchInput = document.querySelector(".sidebar .search input");
        if (searchInput && searchInput.placeholder !== searchPlaceholder) {
          searchInput.placeholder = searchPlaceholder;
          searchInput.setAttribute("aria-label", searchPlaceholder);
        }

        document.querySelectorAll(".docsify-copy-code-button").forEach(function(button) {
          var label = button.querySelector(".label");
          var error = button.querySelector(".error");
          var success = button.querySelector(".success");
          if (label && label.textContent !== copyLabels.button) label.textContent = copyLabels.button;
          if (error && error.textContent !== copyLabels.error) error.textContent = copyLabels.error;
          if (success && success.textContent !== copyLabels.success) success.textContent = copyLabels.success;
        });

        document.querySelectorAll(".pagination-item--previous .pagination-item-label span")
          .forEach(function(label) {
            var text = isThai ? "ก่อนหน้า" : "Previous";
            if (label.textContent !== text) label.textContent = text;
          });
        document.querySelectorAll(".pagination-item--next .pagination-item-label span")
          .forEach(function(label) {
            var text = isThai ? "ถัดไป" : "Next";
            if (label.textContent !== text) label.textContent = text;
          });

        updateThemeToggle(isThai);
      }

      function updateThemeToggle(isThai) {
        var isLight = document.documentElement.getAttribute("data-doc-theme") === "light";
        var label = isLight
          ? (isThai ? "เปลี่ยนเป็นธีมมืด" : "Switch to dark theme")
          : (isThai ? "เปลี่ยนเป็นธีมสว่าง" : "Switch to light theme");
        var mode = isLight
          ? (isThai ? "มืด" : "Dark")
          : (isThai ? "สว่าง" : "Light");
        var modeLabel = themeToggle.querySelector("span");

        if (themeToggle.getAttribute("aria-label") !== label) {
          themeToggle.setAttribute("aria-label", label);
        }
        if (themeToggle.title !== label) {
          themeToggle.title = label;
        }
        if (modeLabel && modeLabel.textContent !== mode) {
          modeLabel.textContent = mode;
        }
      }

      function updateSidebarFooter(isThai) {
        var sidebar = document.querySelector(".sidebar");
        if (!sidebar) return;

        var footer = sidebar.querySelector(".sidebar-footer");
        if (!footer) {
          footer = document.createElement("div");
          footer.className = "sidebar-footer";

          var link = document.createElement("a");
          link.href = "https://github.com/arsyny1x/Astra-Ui-Library";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          footer.appendChild(link);

          var caption = document.createElement("span");
          caption.className = "sidebar-footer-caption";
          footer.appendChild(caption);
          sidebar.appendChild(footer);
        }

        var link = footer.querySelector("a");
        var caption = footer.querySelector(".sidebar-footer-caption");
        var linkText = isThai ? "ดูโปรเจกต์บน GitHub" : "View project on GitHub";
        var captionText = isThai ? "เอกสาร Astra UI" : "Astra UI documentation";
        if (link.textContent !== linkText) link.textContent = linkText;
        if (caption.textContent !== captionText) caption.textContent = captionText;
      }

      function updatePageToc(isThai) {
        var article = document.querySelector(".markdown-section");
        var headings = article ? Array.prototype.slice.call(article.querySelectorAll("h2, h3")) : [];
        var items = headings.map(function(heading) {
          var anchor = heading.querySelector("a");
          return {
            level: heading.tagName === "H3" ? "3" : "2",
            label: (anchor ? anchor.textContent : heading.textContent).trim(),
            href: anchor ? anchor.getAttribute("href") : ("#" + heading.id)
          };
        });
        var signature = (isThai ? "th|" : "en|") + items.map(function(item) {
          return item.level + ":" + item.label + ":" + item.href;
        }).join("|");

        if (pageToc.getAttribute("data-signature") === signature) return;
        pageToc.setAttribute("data-signature", signature);
        pageToc.setAttribute("aria-label", isThai ? "ในหน้านี้" : "On this page");
        pageToc.textContent = "";

        if (items.length < 2) {
          pageToc.classList.remove("is-visible");
          return;
        }

        var title = document.createElement("p");
        title.className = "page-toc-title";
        title.textContent = isThai ? "ในหน้านี้" : "On this page";

        var list = document.createElement("nav");
        list.className = "page-toc-list";
        list.setAttribute("aria-label", title.textContent);

        items.forEach(function(item) {
          var link = document.createElement("a");
          link.href = item.href;
          link.textContent = item.label;
          link.setAttribute("data-level", item.level);
          list.appendChild(link);
        });

        pageToc.appendChild(title);
        pageToc.appendChild(list);
        pageToc.classList.add("is-visible");
      }

      function updateBreadcrumbs(isThai) {
        var home = document.getElementById("breadcrumb-home");
        var section = document.getElementById("breadcrumb-section");
        var page = document.getElementById("breadcrumb-page");
        var activeLink = document.querySelector(".sidebar-nav li.active > a");
        var heading = document.querySelector(".markdown-section h1");
        var title = heading ? heading.textContent.trim() : (isThai ? "เอกสาร" : "Documentation");
        var group = "";

        if (activeLink) {
          var list = activeLink.parentElement.closest("ul");
          while (list && list.parentElement && !list.previousElementSibling) {
            list = list.parentElement.closest("ul");
          }
          var groupHeading = list && list.previousElementSibling;
          if (groupHeading && groupHeading.tagName === "P") {
            group = groupHeading.textContent.trim();
          }
        }

        if (!group) group = isThai ? "เอกสาร" : "Documentation";
        if (home.textContent !== (isThai ? "เอกสาร" : "Docs")) {
          home.textContent = isThai ? "เอกสาร" : "Docs";
        }
        if (section.textContent !== group) section.textContent = group;
        if (page.textContent !== title) page.textContent = title;
      }

      function frameStandaloneCodeBlocks() {
        var codeBlocks = document.querySelectorAll(".markdown-section pre");
        Array.prototype.forEach.call(codeBlocks, function(pre) {
          if (pre.closest(".astra-code-tabs")) return;

          var language = pre.getAttribute("data-lang") || "code";
          var frame = document.createElement("div");
          frame.className = "astra-code-tabs astra-code-single";
          frame.setAttribute("role", "group");
          frame.setAttribute("aria-label", language + " code sample");

          var bar = document.createElement("div");
          bar.className = "astra-code-tabs-bar";

          var label = document.createElement("span");
          label.className = "astra-code-single-label";
          label.textContent = language;
          bar.appendChild(label);

          pre.parentNode.insertBefore(frame, pre);
          frame.appendChild(bar);
          frame.appendChild(pre);
        });
      }

      function highlightCodeBlocks() {
        var prism = window.Prism;
        if (!prism || !prism.languages) return;

        var codeBlocks = document.querySelectorAll(".markdown-section pre code");
        Array.prototype.forEach.call(codeBlocks, function(code) {
          if (code.querySelector(".token")) return;

          var languageClass = code.className.match(/(?:^|\s)(?:lang|language)-([\w-]+)/);
          if (!languageClass || !prism.languages[languageClass[1]]) return;

          prism.highlightElement(code);
        });
      }

      function updateDocsShell(isThai) {
        frameStandaloneCodeBlocks();
        highlightCodeBlocks();
        updateSidebarFooter(isThai);
        updateBreadcrumbs(isThai);
        updatePageToc(isThai);
        syncResponsiveLayout();
      }

      function syncResponsiveLayout() {
        var content = document.querySelector(".content");
        var topbar = document.querySelector(".docs-topbar");
        if (!content || !topbar) return;

        var isMobile = window.matchMedia("(max-width: 768px)").matches;
        var isWide = window.matchMedia("(min-width: 1540px)").matches;
        var isCollapsed = document.body.classList.contains("sidebar-collapsed");
        var contentLeft = isMobile || isCollapsed ? "0" : "var(--docs-content-left)";
        var contentWidth;

        if (isMobile) {
          contentWidth = "100%";
        } else if (isWide) {
          contentWidth = isCollapsed ? "calc(100% - 240px)" : "calc(100% - var(--docs-content-left) - 240px)";
        } else {
          contentWidth = isCollapsed ? "100%" : "calc(100% - var(--docs-content-left))";
        }

        content.style.setProperty("left", contentLeft, "important");
        content.style.setProperty("width", contentWidth, "important");
        topbar.style.setProperty("left", contentLeft, "important");
        topbar.style.setProperty("right", "0", "important");
        topbar.style.setProperty("width", "auto", "important");
        content.style.setProperty("transition", "none", "important");
        topbar.style.setProperty("transition", "none", "important");
      }

      function syncLanguage() {
        var route = window.location.hash.slice(1).split("?")[0].toLowerCase();
        var isThai = route === "/readme.th" || route.indexOf("/docs/th/") === 0;
        languageSelect.value = isThai ? "th" : "en";
        updateLanguageUi(isThai);
        updateDocsShell(isThai);
      }

      window.updateDocsLanguage = syncLanguage;

      languageSelect.addEventListener("change", function() {
        var route = window.location.hash.slice(1).split("?")[0];
        var isThai = languageSelect.value === "th";
        var target = route;

        updateLanguageUi(isThai);

        if (isThai) {
          if (route === "" || route === "/" || route.toLowerCase() === "/readme") {
            target = "/docs/th/README";
          } else if (route.indexOf("/docs/th/") !== 0 && route.indexOf("/docs/") === 0) {
            target = route.replace(/^\/docs\//, "/docs/th/");
          } else if (route.indexOf("/docs/") !== 0) {
            target = "/docs/th/README";
          }
        } else if (route.toLowerCase() === "/readme.th" || route.toLowerCase() === "/docs/th/readme") {
          target = "/README";
        } else if (route.indexOf("/docs/th/") === 0) {
          target = route.replace(/^\/docs\/th\//, "/docs/");
        }

        if (target !== route) {
          window.location.hash = target;
        }
      });

      themeToggle.addEventListener("click", function() {
        var isLight = document.documentElement.getAttribute("data-doc-theme") === "light";
        document.documentElement.setAttribute("data-doc-theme", isLight ? "dark" : "light");
        updateThemeToggle(document.documentElement.lang === "th");
      });

      sidebarToggle.addEventListener("click", function() {
        var isMobile = window.matchMedia("(max-width: 768px)").matches;
        var className = isMobile ? "sidebar-open" : "sidebar-collapsed";
        var isOpen = document.body.classList.toggle(className);
        sidebarToggle.setAttribute("aria-expanded", String(isMobile ? isOpen : !isOpen));
        syncResponsiveLayout();
      });

      document.body.addEventListener("click", function(event) {
        var tab = event.target.closest("[data-code-tab]");
        if (tab) {
          var group = tab.closest("[data-code-tabs]");
          var selectedTab = tab.getAttribute("data-code-tab");
          group.querySelectorAll("[data-code-tab]").forEach(function(button) {
            var selected = button === tab;
            button.setAttribute("aria-selected", String(selected));
            button.tabIndex = selected ? 0 : -1;
          });
          group.querySelectorAll("[data-code-panel]").forEach(function(panel) {
            panel.hidden = panel.getAttribute("data-code-panel") !== selectedTab;
          });
          return;
        }

        if (window.matchMedia("(max-width: 768px)").matches
            && event.target.closest(".sidebar-nav a")) {
          document.body.classList.remove("sidebar-open");
          sidebarToggle.setAttribute("aria-expanded", "false");
        }
      });

      document.body.addEventListener("keydown", function(event) {
        var activeTab = event.target.closest("[data-code-tab]");
        if (!activeTab || (event.key !== "ArrowLeft" && event.key !== "ArrowRight")) return;

        var tabs = Array.prototype.slice.call(activeTab.closest("[role=tablist]").querySelectorAll("[data-code-tab]"));
        var index = tabs.indexOf(activeTab);
        var direction = event.key === "ArrowRight" ? 1 : -1;
        tabs[(index + direction + tabs.length) % tabs.length].click();
        tabs[(index + direction + tabs.length) % tabs.length].focus();
        event.preventDefault();
      });

      window.addEventListener("hashchange", syncLanguage);
      window.addEventListener("resize", syncResponsiveLayout);
      syncLanguage();
      syncResponsiveLayout();

      if (window.MutationObserver && document.body) {
        var languageUpdateTimer;
        var observer = new MutationObserver(function() {
          window.clearTimeout(languageUpdateTimer);
          languageUpdateTimer = window.setTimeout(syncLanguage, 100);
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
</body>
